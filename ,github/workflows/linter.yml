# .github/workflows/linter.yml
name: Code Quality Check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        # Para o build se houver erros de sintaxe ou variáveis indefinidas
        flake8 src main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Avisos gerais (não param o build)
        flake8 src main.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics